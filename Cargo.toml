[workspace]
members = [
  "crates/ferrimock",
  "crates/ferrimock-cli",
  "crates/ferrimock-ml",
  "crates/ferrimock-napi",
]

resolver = "2"

[workspace.package]
version = "0.4.1"
authors = ["Salama Ashoush <salamaashoush@gmail.com>"]
edition = "2024"
# Verified floor for the stable feature set; the `scripting` feature
# needs nightly regardless (rolldown's oxc tree uses if-let guards).
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/salamaashoush/ferrimock"
description = "A high-performance HTTP mocking engine with templates, recording, consolidation, and GraphQL support"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unit_bindings = "warn"
unused_unsafe = "warn"

[workspace.lints.clippy]
# Core quality gates - groups have lower priority so individual overrides work
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Restriction lints - opt-in, catch common mistakes
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
exit = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
get_unwrap = "warn"
rest_pat_in_fully_bound_structs = "warn"
undocumented_unsafe_blocks = "warn"
infinite_loop = "warn"
unused_result_ok = "warn"
# `assert!(!x.is_empty())` reads better than the suggested
# `assert_ne!(x, [] as [String; 0])`, which needs the element type spelled out.
assert_is_empty = "allow"
pathbuf_init_then_push = "warn"

# Crash prevention
indexing_slicing = "warn"
string_slice = "warn"
panic = "warn"
unreachable = "warn"

# Additional safety
unused_async = "warn"

# Performance
cloned_instead_of_copied = "warn"
large_enum_variant = "warn"
unnecessary_to_owned = "warn"
ptr_arg = "warn"
redundant_clone = "warn"

# Safety and correctness
async_yields_async = "warn"
cast_slice_different_sizes = "warn"
mem_forget = "warn"
significant_drop_in_scrutinee = "warn"
iter_on_single_items = "warn"
unused_peekable = "warn"

# Idiomatic Rust - selected pedantic lints
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
inefficient_to_string = "warn"
explicit_iter_loop = "warn"

# Allowed lints - too noisy or not applicable
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
print_stdout = "allow"
print_stderr = "allow"

# Nursery lints - allow noisy ones
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
cognitive_complexity = "allow"
use_self = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
fallible_impl_from = "allow"
useless_let_if_seq = "allow"
impl_trait_in_params = "allow"

# Cargo metadata
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

[workspace.dependencies]
# Async runtime
futures = "0.3"
tokio = { version = "1.53", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.7", features = ["cors", "trace", "timeout"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# Proxy. axum serves the connection; these are the pieces it has no opinion
# about -- an upstream client, TLS material, and a body combinator for the
# recording tee.
hyper = { version = "1.11", features = ["http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body = "1"
http-body-util = "0.1"
# aws-lc-rs everywhere: rustls resolves its crypto provider process-wide, and a
# second provider in the tree turns that into a runtime panic on first connect.
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1",
  "http2",
  "aws-lc-rs",
  "native-tokio",
  "webpki-tokio",
  "tls12",
  "logging",
] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rcgen = "0.14"
pin-project-lite = "0.2"

# Serialization
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde_yaml_ng = "0.10"

# Error handling and logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.2"
flate2 = "1.1"
globset = "0.4"
har = "0.9"
json-patch = "4.2"
lean_string = { version = "0.7", features = ["serde"] }
lru = "0.18"
nohash-hasher = "0.2"
notify = "8.2"
parking_lot = "0.12"
regex = "1.13"
regex-syntax = "0.8"
rustc-hash = "2.1"
sha2 = "0.11"
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
url = "2.5"
urlencoding = "2.1.3"
uuid = { version = "1.24", features = ["v4", "serde"] }

# CLI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
dirs = "6.0"
colored = "3.1"
comfy-table = { version = "8.0", features = ["custom_styling"] }
indicatif = "0.18"
open = "5.4"

# Fake data
fake = { version = "5.1", features = ["derive", "chrono", "http", "uuid"] }
rand = "0.10"

# Image/PDF generation
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Without default features: `image/default` drags the AVIF encoder in
# (rav1e -> core2, unmaintained/yanked); drawing text needs only `text`.
imageproc = { version = "0.27.0", default-features = false, features = ["rayon", "text"] }
# default-features pull lopdf's datetime integrations (time/jiff/chrono
# interop, currently broken against newer `time`); fake_pdf only writes
# documents and needs none of them.
lopdf = { version = "0.44", default-features = false }
# No "compression" feature: it pulls include-flate -> proc-macro-error2,
# which trips a future-incompat lint (E0365) with no fixed release. The
# only embedded asset is one font; the size trade is acceptable.
rust-embed = { version = "8.12" }

# GraphQL execution (spec feature): dynamic schema built at runtime from a
# parsed spec, plus the SDL parser (arrives transitively, pinned for clarity).
async-graphql = { version = "7.2", default-features = false, features = ["dynamic-schema"] }
async-graphql-parser = "7.2"

# Template engine
tera = "2.1"
# Tera 2 moved its dependency-heavy built-ins out of core; json_encode, date,
# now and get_random are part of the documented mock template surface.
tera-contrib = { version = "0.2", features = ["json", "date", "rand"] }

# QuickJS scripting (scripting feature)
# `full-async` does NOT imply `parallel`; without it AsyncRuntime is !Send/!Sync
# and HandlerFn closures (Send + Sync) cannot reach the VM.
rquickjs = { version = "0.12", features = ["full-async", "parallel", "macro", "loader", "array-buffer"] }
rquickjs-serde = "0.6"
# Bundler front-end: rolldown bundles + tree-shakes + transpiles TS to one ESM
# module (resolving node_modules), compiled once to QuickJS bytecode.
rolldown = "1"
# canonicalize without Windows \\?\ verbatim prefixes (rolldown cannot
# resolve them as entry paths)
dunce = "1"
rolldown_common = "1"
rolldown_plugin = "1"
# Remap QuickJS error line:col (bundled output) back to original .ts/.js.
sourcemap = "9"

# Testing
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
tempfile = "3.27"
serial_test = "3.5"
proptest = "1.11"

# HTTP
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2"] }

# Release ships a NAPI addon and a CLI where cross-crate inlining matters:
# matching, template rendering and fake-data generation all cross crate
# boundaries on the hot path. Cargo's defaults (no LTO, 16 codegen units)
# leave that on the table.
[profile.release]
lto = "fat"
codegen-units = 1
# `panic = "abort"` is deliberately NOT set: napi-rs turns a Rust panic into a
# JS exception by unwinding, and aborting would take the host process with it.

[profile.dev]
debug = false

[profile.dev.package]
serde.opt-level = 2
serde_json.opt-level = 2
tokio.opt-level = 2
regex.opt-level = 2
regex-automata.opt-level = 2
dashmap.opt-level = 2
